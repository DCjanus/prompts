name: tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false
      - name: Check Python formatting
        run: uvx ruff format --check .
      - name: Check Python lint
        run: uvx ruff check .

  script-dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false
      - name: Check uv script dependencies
        run: ./scripts/script_deps.py --only-attention --fail-on-attention --github-summary

  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install Codex CLI for plugin integration tests
        run: npm install --global @openai/codex
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false
      - name: Run all tests
        run: ./scripts/run_tests.py
