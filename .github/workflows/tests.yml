name: tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  notification-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/dcjanus/skills/notify-via-telegram/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install pnpm
        run: npm install --global pnpm@12.9.1
      - name: Install Worker dependencies
        run: pnpm install --frozen-lockfile
      - name: Test deep links
        run: pnpm test
      - name: Validate Worker deployment
        run: pnpm exec cf deploy --dry-run

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false
      - name: Check Python formatting
        run: uvx ruff format --check .
      - name: Check Python lint
        run: uvx ruff check .

  script-dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false
      - name: Check uv script dependencies
        run: ./scripts/script_deps.py --only-attention --fail-on-attention --github-summary

  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install Codex CLI for plugin integration tests
        run: npm install --global @openai/codex
      - name: Install Claude Code CLI for plugin integration tests
        run: npm install --global @anthropic-ai/claude-code
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false
      - name: Run all tests
        run: ./scripts/run_tests.py
