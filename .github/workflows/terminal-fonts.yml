name: terminal fonts

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - 'scripts/merge_terminal_fonts.py'
      - 'scripts/terminal_font_sources.py'
      - 'terminal-fonts.toml'
      - 'licenses/terminal-fonts/**'
      - '.github/workflows/terminal-fonts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminal-fonts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false
      - name: Check upstream releases and approved assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/terminal_font_sources.py check

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false
      - name: Download verified sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/terminal_font_sources.py fetch --output-dir font-sources
      - name: Build and validate all four faces
        run: |
          ./scripts/merge_terminal_fonts.py \
            --sarasa font-sources/sarasa/Sarasa-SuperTTC.ttc \
            --lilex-dir font-sources/lilex --output-dir terminal-fonts
          cp terminal-fonts.toml terminal-fonts/
          zip -j terminal-fonts.zip terminal-fonts/*
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: terminal-fonts
          path: terminal-fonts.zip
          retention-days: 3

  publish:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/download-artifact@v8.0.2
        with:
          name: terminal-fonts
      - name: Replace the rolling font release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF_NOTES
          已验证的 DC Mono SC 四样式字体，包含来源清单、构建报告、OFL 许可证及 Ghostty 配置片段。

          构建提交：${GITHUB_SHA}
          安装与更新：https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/terminal-fonts.md

          此 release 固定使用 terminal-fonts-latest 标签，每次成功构建覆盖同名附件，不保留历史字体 release。
          EOF_NOTES
          if gh release view terminal-fonts-latest >/dev/null 2>&1; then
            gh release upload terminal-fonts-latest terminal-fonts.zip --clobber
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/terminal-fonts-latest" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit terminal-fonts-latest --title 'DC Mono SC — latest' \
              --notes-file release-notes.md --latest=false
          else
            gh release create terminal-fonts-latest terminal-fonts.zip --target "$GITHUB_SHA" \
              --title 'DC Mono SC — latest' --notes-file release-notes.md --latest=false
          fi
